name: Reproduce saved-data results
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify saved responses and derived tables
        run: python -B scripts/reproduce.py --check
      - name: Run release checks
        run: python -B scripts/test_release.py
